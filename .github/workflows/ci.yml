name: CI

# Validates the current codebase as-is (install, build) — no deploy step,
# no server secrets required. Runs on every push and PR to any branch.
# (lint is intentionally omitted: this repo has no ESLint config, so
# `next lint` prompts interactively on first run and would hang in CI.)
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
