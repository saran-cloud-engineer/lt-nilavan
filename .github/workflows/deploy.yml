name: Deploy

# Builds and deploys the app over SSH. Runs on every push, any branch, plus
# manual "Run workflow". This is the ONLY trigger for the scan workflow too —
# see scan.yml, which only runs once this one finishes (workflow_run), it
# never listens to push directly.
#
# Requires repo secrets (see PREREQUISITES.md):
#   SSH_HOST, SSH_PORT, SSH_USER, SSH_PRIVATE_KEY, APP_DIR
on:
  push:
  workflow_dispatch: {}

# Only one run touches the (single, tiny) EC2 box at a time. A new run
# cancels an in-progress one rather than racing it — running two
# `npm ci`/`npm run build` at once on a t2/t3.micro thrashes it into swap.
concurrency:
  group: deploy-to-ec2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # Fail fast in CI before we ever touch the server.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            export NVM_DIR="$HOME/.nvm"
            source "$NVM_DIR/nvm.sh"
            cd "${{ secrets.APP_DIR }}"
            git fetch origin
            git checkout "${{ github.ref_name }}"
            git pull origin "${{ github.ref_name }}"
            npm ci
            npm run build
            pm2 restart lt-nilavan
