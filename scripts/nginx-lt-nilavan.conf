server {
    listen 80;
    listen [::]:80;
    server_name nilavan-v1.cloudworkspace.fun;

    # Block public access to .git (and other VCS/metadata dirs) — required task.
    location ~ /\.(git|svn|hg) {
        deny all;
        return 404;
    }

    # Block common sensitive files if present at the web root.
    location ~ /\.(env|env\.local|env\.production) {
        deny all;
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}