# /etc/nginx/sites-available/lt-nilavan.conf
#
# Rebuilt from the config actually live on the server (including Certbot's
# SSL additions — see reports/server-evidence/nginx-config.txt) plus two new
# fixes: per-IP rate limiting on the contact-form API, and security headers
# (clickjacking / MIME-sniffing / HSTS).
#
# Also requires scripts/nginx-ratelimit.conf installed to
# /etc/nginx/conf.d/ratelimit.conf (the `limit_req_zone` it defines must live
# in Nginx's http{} context, not here).
#
# Install (replaces the file wholesale — safe, this version keeps all the
# existing Certbot SSL directives):
#   sudo cp scripts/nginx-ratelimit.conf /etc/nginx/conf.d/ratelimit.conf
#   sudo cp scripts/nginx-lt-nilavan.conf /etc/nginx/sites-available/lt-nilavan.conf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    server_name nilavan-v1.cloudworkspace.fun;

    # --- Security headers (fixes: clickjacking, MIME-sniffing, HSTS) ---
    # `always` ensures these are sent on error responses (404s) too, not just 200s.
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Block public access to .git (and other VCS/metadata dirs) — required task.
    location ~ /\.(git|svn|hg) {
        deny all;
        return 404;
    }

    # Block common sensitive files if present at the web root.
    location ~ /\.(env|env\.local|env\.production) {
        deny all;
        return 404;
    }

    # --- Rate limiting on the contact-form endpoint (fixes: spam-flood) ---
    # burst=3 nodelay: allow a small burst above the steady 5r/m before
    # rejecting, without queuing/delaying requests — they either pass
    # immediately or get 429 immediately.
    location /api/sendgrid {
        limit_req zone=contact_form burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/nilavan-v1.cloudworkspace.fun/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/nilavan-v1.cloudworkspace.fun/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = nilavan-v1.cloudworkspace.fun) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name nilavan-v1.cloudworkspace.fun;
    return 404; # managed by Certbot
}
