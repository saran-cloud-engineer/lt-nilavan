# /etc/nginx/conf.d/ratelimit.conf
#
# limit_req_zone can only be declared in the `http {}` context, not inside a
# server block — that's why this is a separate file. Ubuntu's default
# nginx.conf already includes /etc/nginx/conf.d/*.conf from within its http
# block, so dropping this here is enough; no edit to nginx.conf itself needed.
#
# Install:
#   sudo cp scripts/nginx-ratelimit.conf /etc/nginx/conf.d/ratelimit.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 5 requests/minute per client IP, tracked in a 10MB shared-memory zone
# (enough for tens of thousands of distinct IPs). Matches the assessment's
# example PoC (10 rapid requests) — expect the first few to succeed and the
# rest to get 429.
limit_req_zone $binary_remote_addr zone=contact_form:10m rate=5r/m;
